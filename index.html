<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fazal Super App</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
<div class="p-4 text-center bg-gradient-to-r from-purple-600 via-blue-600 to-green-600 sticky top-0 z-10">
<h1 class="text-2xl font-bold">FazalAI Super App</h1>
<p class="text-xs opacity-90">Made by Fazal - AI + News + Calculator</p>
</div>

<div id="home" class="p-3">
<div class="bg-gradient-to-r from-red-600 to-orange-600 p-3 rounded-2xl mb-3 flex justify-between items-center">
<h3 class="font-bold">🔴 LIVE Taza Khabar</h3>
<span class="text-xs opacity-80">Pakistan + Duniya - Aaj ki khabrein</span>
</div>

<div class="grid grid-cols-2 gap-3">
<div onclick="openPage('chat')" class="bg-zinc-900 p-4 rounded-2xl text-center border border-zinc-800 active:scale-95 transition">
<div class="text-3xl">🤖</div><div class="font-bold mt-1">AI Chat</div><div class="text-xs text-zinc-400">Fazal AI se baat karo</div>
</div>
<div onclick="openPage('news')" class="bg-zinc-900 p-4 rounded-2xl text-center border border-zinc-800 active:scale-95 transition">
<div class="text-3xl">📰</div><div class="font-bold mt-1">News</div><div class="text-xs text-zinc-400">Taza Khabrein</div>
</div>
<div onclick="openPage('whatsapp')" class="bg-zinc-900 p-4 rounded-2xl text-center border border-zinc-800 ring-2 ring-green-600 active:scale-95 transition">
<div class="text-3xl">💬</div><div class="font-bold mt-1">WhatsApp</div><div class="text-xs text-zinc-400">Direct Message</div>
</div>
<div onclick="openPage('qr')" class="bg-zinc-900 p-4 rounded-2xl text-center border border-zinc-800 active:scale-95 transition">
<div class="text-3xl">🔳</div><div class="font-bold mt-1">QR Maker</div><div class="text-xs text-zinc-400">QR Banao</div>
</div>
<div onclick="openPage('voice')" class="bg-zinc-900 p-4 rounded-2xl text-center border border-zinc-800 active:scale-95 transition">
<div class="text-3xl">🎙️</div><div class="font-bold mt-1">Voice</div><div class="text-xs text-zinc-400">Bol ke likho</div>
</div>
<div onclick="openPage('calc')" class="bg-zinc-900 p-4 rounded-2xl text-center border border-zinc-800 active:scale-95 transition">
<div class="text-3xl">🧮</div><div class="font-bold mt-1">Calculator</div><div class="text-xs text-zinc-400">Hisab Kitab</div>
</div>
</div>
</div>

<div id="content" class="p-3 hidden"></div>

<script>
const GEMINI_API_KEY="";AQ.Ab8RN6LBHwvQeo7UBqYSRJgVq-4REdmQEIHtokyHamWcyDRNKQ // <-- 
const SYSTEM_PROMPT="Tumhara naam FazalAI hai. Tumhe Fazal ne banaya hai. Hamesha Urdu me jawab do.";

document.getElementById('todayDate').innerText=new Date().toLocaleDateString('ur-PK',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

function openPage(t){
 document.getElementById('home').classList.add('hidden'); document.getElementById('content').classList.remove('hidden'); let c=document.getElementById('content');
 if(t=='chat'){c.innerHTML=`<button onclick="goHome()" class="mb-3 bg-zinc-800 px-4 py-2 rounded-full">← Back</button><h2 class="text-xl font-bold mb-3">FazalAI Chat</h2><div id="chatBox" class="h-96 overflow-y-auto bg-zinc-900 rounded-xl p-3 mb-3"></div><div class="flex gap-2"><input id="msg" class="flex-1 bg-zinc-800 p-3 rounded-full outline-none" placeholder="Kuch likho..."><button onclick="sendMsg()" class="bg-blue-600 px-5 py-3 rounded-full">Send</button></div>`}
 if(t=='news'){c.innerHTML=`<button onclick="goHome()" class="mb-3 bg-zinc-800 px-4 py-2 rounded-full">← Back</button><button onclick="loadNews()" class="mb-3 bg-zinc-800 px-4 py-2 rounded-full ml-2">Refresh News</button><div id="newsBox" class="space-y-3"></div>`; loadNews();}
 if(t=='whatsapp'){c.innerHTML=`<button onclick="goHome()" class="mb-3 bg-zinc-800 px-4 py-2 rounded-full">← Back</button><h2 class="text-xl font-bold mb-3">WhatsApp Direct</h2><input id="waNumber" placeholder="Number likho 923001234567" class="w-full bg-zinc-800 p-3 rounded-xl mb-3"><textarea id="waMsg" placeholder="Message" class="w-full bg-zinc-800 p-3 rounded-xl mb-3"></textarea><button onclick="openWA()" class="w-full bg-green-600 p-3 rounded-xl">Open WhatsApp</button>`}
 if(t=='qr'){c.innerHTML=`<button onclick="goHome()" class="mb-3 bg-zinc-800 px-4 py-2 rounded-full">← Back</button><h2 class="text-xl font-bold mb-3">QR Generator</h2><input id="qrInput" class="w-full bg-zinc-800 p-3 rounded-xl mb-3" placeholder="Text likho"><button onclick="makeQR()" class="w-full bg-blue-600 p-3 rounded-xl mb-3">Generate QR</button><div id="qrBox" class="text-center"></div>`}
 if(t=='voice'){c.innerHTML=`<button onclick="goHome()" class="mb-3 bg-zinc-800 px-4 py-2 rounded-full">← Back</button><h2 class="text-xl font-bold mb-3">Voice to Text</h2><button onclick="startVoice()" class="w-full bg-red-600 p-4 rounded-xl">🎙️ Bolna Shuru Karo</button><div id="voiceText" class="mt-4 bg-zinc-900 p-3 rounded-xl min-h-24"></div>`}
 if(t=='calc'){c.innerHTML=`<button onclick="goHome()" class="mb-3 bg-zinc-800 px-4 py-2 rounded-full">← Back</button><h2 class="text-xl font-bold mb-3">Calculator</h2><input id="calcIn" class="w-full bg-zinc-800 p-4 rounded-xl mb-3 text-right text-xl"><div class="grid grid-cols-4 gap-2"><button onclick="doCalc('7')" class="bg-zinc-800 p-4 rounded-xl">7</button><button onclick="doCalc('8')" class="bg-zinc-800 p-4 rounded-xl">8</button><button onclick="doCalc('9')" class="bg-zinc-800 p-4 rounded-xl">9</button><button onclick="doCalc('/')" class="bg-orange-600 p-4 rounded-xl">/</button><button onclick="doCalc('4')" class="bg-zinc-800 p-4 rounded-xl">4</button><button onclick="doCalc('5')" class="bg-zinc-800 p-4 rounded-xl">5</button><button onclick="doCalc('6')" class="bg-zinc-800 p-4 rounded-xl">6</button><button onclick="doCalc('*')" class="bg-orange-600 p-4 rounded-xl">*</button><button onclick="doCalc('1')" class="bg-zinc-800 p-4 rounded-xl">1</button><button onclick="doCalc('2')" class="bg-zinc-800 p-4 rounded-xl">2</button><button onclick="doCalc('3')" class="bg-zinc-800 p-4 rounded-xl">3</button><button onclick="doCalc('-')" class="bg-orange-600 p-4 rounded-xl">-</button><button onclick="doCalc('0')" class="bg-zinc-800 p-4 rounded-xl">0</button><button onclick="doCalc('.')" class="bg-zinc-800 p-4 rounded-xl">.</button><button onclick="doCalc('=')" class="bg-green-600 p-4 rounded-xl">=</button><button onclick="doCalc('+')" class="bg-orange-600 p-4 rounded-xl">+</button><button onclick="doCalc('C')" class="col-span-4 bg-red-600 p-3 rounded-xl mt-2">Clear</button></div><div id="calcOut" class="mt-3 bg-zinc-900 p-3 rounded-xl text-xl"></div>`}
}
function goHome(){document.getElementById('content').classList.add('hidden');document.getElementById('home').classList.remove('hidden');}

async function loadNews(){
 let box=document.getElementById('newsBox'); if(!box) return; box.innerHTML=`<div class="text-center p-10">⏳<br>News load ho rahi hai...</div>`;
 let rssJson=`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss?hl=ur&gl=PK&ceid=PK:ur')}`;
 document.querySelectorAll('#btnPak,#btnWorld,#btnAI').forEach(b=>{b.classList.remove('flex-1','bg-zinc-800','p-2','rounded-full');});
 try{ let res=await fetch(rssJson); let data=await res.json(); let items=data.items; let html=''; if(!items||items.length==0) box.innerHTML='News nahi mili'; items.slice(0,20).forEach(n=>{ html+=`<div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800"><a href="${n.link}" target="_blank" class="font-bold">${n.title}</a><p class="text-zinc-400 mt-2 text-sm">${n.description?.slice(0,120)}...</p></div>`}); box.innerHTML=html; }catch(e){box.innerHTML='News load nahi hui, Internet check karo';}
}

async function sendMsg(){
 let m=document.getElementById('msg').value; if(!m) return; let box=document.getElementById('chatBox'); box.innerHTML+=`<div class="text-right mb-2"><span class="bg-blue-600 px-3 py-2 rounded-2xl inline-block">${m}</span></div>`; document.getElementById('msg').value=''; box.scrollTop=box.scrollHeight;
 try{
  // NAYI AQ KEY KE LIYE SAHI TAREEQA
  let res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent', {
    method: 'POST',
    headers: { 'Content-Type':'application/json', 'x-goog-api-key': GEMINI_API_KEY },
    body: JSON.stringify({ contents: [{ parts: [{ text: SYSTEM_PROMPT + " User: " + m }] }] })
  });
  let data=await res.json(); let reply=data.candidates?.[0]?.content?.parts?.[0]?.text || "Jawab nahi mila";
  box.innerHTML+=`<div class="text-left mb-2"><span class="bg-zinc-800 px-3 py-2 rounded-2xl inline-block">${reply}</span></div>`;
 }catch(e){ box.innerHTML+=`<div class="text-left mb-2"><span class="bg-red-900 px-3 py-2 rounded-2xl inline-block">Error: ${e.message}</span></div>`; }
 box.scrollTop=box.scrollHeight;
}
function makeQR(){let t=document.getElementById('qrInput').value; if(!t){alert('Kuch likho');return;} document.getElementById('qrBox').innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(t)}" class="mx-auto rounded-xl">`;}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert('Browser support nahi karta');return;} let r=new SR(); r.lang='ur-PK'; r.onresult=(e)=>{document.getElementById('voiceText').innerText=e.results[0][0].transcript}; r.start();}
function doCalc(v){try{if(v=='C'){document.getElementById('calcIn').value='';document.getElementById('calcOut').innerText='';}else if(v=='='){document.getElementById('calcOut').innerText='='+eval(document.getElementById('calcIn').value)}else{document.getElementById('calcIn').value+=v}}catch(e){document.getElementById('calcOut').innerText='Error'}}
function openWA(){let n=document.getElementById('waNumber').value.replace(/[^0-9]/g,''); let m=document.getElementById('waNumber').value; let msg=document.getElementById('waMsg').value; if(!n){alert('Number likho!');return;} window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,'_blank');}
</script></body></html>l
