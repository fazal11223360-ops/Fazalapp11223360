<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FazalAI Super App</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
<header class="bg-gradient-to-r from-purple-600 to-blue-600 p-4 text-center">
<h1 class="text-2xl font-bold">FazalAI Super App</h1>
</header>

<div class="p-4">
<div id="chatBox" class="bg-zinc-900 h-96 overflow-y-auto p-3 rounded-xl mb-3 text-sm space-y-3"></div>
<div class="flex gap-2">
<input id="userInput" class="flex-1 p-3 rounded-xl bg-zinc-800 outline-none" placeholder="Explain how AI works in a few words">
<button onclick="askAI()" class="bg-blue-600 px-6 rounded-xl font-bold">Send</button>
</div>
</div>

<script>
// YAHAN APNI KEY DALO - Khali chora hai
const API_KEY = "AQ.Ab8RN6J96HwcvVuO73qPP1yJF3PwmFzp2v-9arPgOrBTq_t43g;

async function askAI(){
  const input = document.getElementById('userInput');
  const box = document.getElementById('chatBox');
  let q = input.value.trim() || "Explain how AI works in a few words";
  if(API_KEY === ""){ alert("Pehle apni API Key dalo!"); return; }

  box.innerHTML += `<div class="text-right"><div class="inline-block bg-blue-600 p-2 rounded-lg">${q}</div></div>`;
  input.value = "";
  let id = Date.now();
  box.innerHTML += `<div id="${id}" class="opacity-50">AI soch raha hai...</div>`;
  box.scrollTop = box.scrollHeight;

  try{
    // Aapka diya hua CURL code ka sahi fetch version
    const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-goog-api-key": API_KEY
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: q }] }]
      })
    });

    const data = await res.json();
    document.getElementById(id)?.remove();

    if(data.error){ throw new Error(data.error.message); }

    let ans = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response";
    box.innerHTML += `<div class="text-left"><div class="inline-block bg-zinc-800 p-3 rounded-lg whitespace-pre-wrap">${ans}</div></div>`;
  }catch(e){
    document.getElementById(id)?.remove();
    box.innerHTML += `<div class="bg-red-900/50 p-2 rounded text-red-300">Error: ${e.message}</div>`;
  }
  box.scrollTop = box.scrollHeight;
}
document.getElementById('userInput').addEventListener('keydown', e=>{ if(e.key==='Enter') askAI(); });
</script>
</body>
</html>
